apiVersion: apps/v1
kind: Deployment
metadata:
  name: springboot-crud-deployment
spec:
  selector:
    matchLabels:
      app: springboot-k8s-mongodb
  replicas: 10
  template:
    metadata:
      labels:
        app: springboot-k8s-mongodb
    spec:
      containers:
        - name: springboot-crud-k8s
          image: marcosjrlopes/order-manager:v6
          ports:
            - containerPort: 8080
          env:   
            - name: DB_HOST   
              valueFrom :
                configMapKeyRef :
                  name : db-config
                  key :  host

            - name: DB_NAME 
              valueFrom :
                configMapKeyRef :
                  name : db-config
                  key :  dbName
---
apiVersion: v1 
kind: Service
metadata: 
  name: springboot-crud-svc
spec:
  selector:
    app: springboot-k8s-mongodb
  ports:
    - protocol: "TCP"
      port: 8080 
      targetPort: 8080
  type: NodePort 

