apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mongodb-pv-claim 
  labels:
    app: mongodb
    tier: database
spec:
  accessModes:
    - ReadWriteOnce  
  resources:
    requests:
      storage: 1Gi   
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongodb
  labels:
    app: mongodb
    tier: database
spec:
  selector: 
    matchLabels:
      app: mongodb
      tier: database
  strategy:
    type: Recreate
  template:
    metadata:
      labels: 
        app: mongodb
        tier: database
    spec:
      containers:
        - image: mongo:latest
          name: mongodb
          ports:
            - containerPort: 27017
              name: mongodb
          volumeMounts:   
            - name: mongodb-persistent-storage
              mountPath: /data/db
      volumes:
        - name: mongodb-persistent-storage
          persistentVolumeClaim:
            claimName: mongodb-pv-claim
---
apiVersion: v1
kind: Service
metadata:
  name: mongodb
  labels:
    app: mongodb
    tier: database
spec:
  ports:
    - port: 27017
      targetPort: 27017
  selector:      
    app: mongodb
    tier: database
  clusterIP: None 